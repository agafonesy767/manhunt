<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANHUNT - Loading</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Special Elite', monospace;
            cursor: none;
        }

        .bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('https://i.yapx.ru/dNe4E.png') center/cover no-repeat;
            filter: grayscale(100%) brightness(0.3) contrast(1.3);
            z-index: 0;
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.15) 2px,
                rgba(0,0,0,0.15) 4px
            );
            z-index: 1;
            pointer-events: none;
        }

        .grain {
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            z-index: 2;
            pointer-events: none;
            opacity: 0.08;
            animation: grainMove 0.5s steps(4) infinite;
        }

        @keyframes grainMove {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-5%, -5%); }
            50% { transform: translate(5%, 3%); }
            75% { transform: translate(-3%, 5%); }
            100% { transform: translate(3%, -3%); }
        }

        .vignette {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%);
            z-index: 3;
            pointer-events: none;
        }

        .content {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: screenFlicker 4s infinite;
        }

        @keyframes screenFlicker {
            0%, 100% { opacity: 1; }
            92% { opacity: 1; }
            93% { opacity: 0.7; }
            94% { opacity: 1; }
            96% { opacity: 0.85; }
            97% { opacity: 1; }
        }

        .title {
            font-size: clamp(60px, 10vw, 140px);
            color: #fff;
            letter-spacing: 14px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255,255,255,0.15);
            animation: titlePulse 3s ease-in-out infinite;
            margin-bottom: 60px;
            user-select: none;
        }

        @keyframes titlePulse {
            0%, 100% { opacity: 0.85; text-shadow: 0 0 8px rgba(255,255,255,0.15); }
            50% { opacity: 1; text-shadow: 0 0 12px rgba(255,255,255,0.25); }
        }

        .connecting {
            font-size: clamp(14px, 2vw, 22px);
            color: #aaa;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 30px;
            animation: blink 1.8s ease-in-out infinite;
            user-select: none;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        .progress-container {
            width: clamp(280px, 40vw, 500px);
            height: 2px;
            background: rgba(255,255,255,0.08);
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 35%;
            height: 100%;
            background: #fff;
            box-shadow: 0 0 6px rgba(255,255,255,0.3);
            animation: sweep 2s ease-in-out infinite;
        }

        @keyframes sweep {
            0% { left: -35%; }
            50% { left: 100%; }
            100% { left: -35%; }
        }

        .distort {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
            animation: distortGlitch 8s infinite;
        }

        @keyframes distortGlitch {
            0%, 100% { clip-path: none; opacity: 0; }
            45% { clip-path: none; opacity: 0; }
            45.5% { clip-path: inset(20% 0 60% 0); opacity: 1; background: rgba(255,255,255,0.02); transform: translateX(-3px); }
            46% { clip-path: inset(70% 0 10% 0); opacity: 1; background: rgba(255,255,255,0.02); transform: translateX(3px); }
            46.5% { clip-path: none; opacity: 0; transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="scanlines"></div>
    <canvas class="grain" id="grain"></canvas>
    <div class="vignette"></div>

    <div class="content">
        <div class="title">MANHUNT</div>
        <div class="connecting">Connecting...</div>
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <div class="distort"></div>

    <script>
        // Grain canvas
        const canvas = document.getElementById('grain');
        const ctx = canvas.getContext('2d');
        canvas.width = 512;
        canvas.height = 512;

        function drawGrain() {
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const v = Math.random() * 255;
                data[i] = v;
                data[i + 1] = v;
                data[i + 2] = v;
                data[i + 3] = 255;
            }
            ctx.putImageData(imageData, 0, 0);
        }

        setInterval(drawGrain, 100);
        drawGrain();

        // Music playback
        let musicStarted = false;
        const audioSrc = 'https://image2url.com/r2/default/audio/1774174807523-79a928e1-5b41-4a16-8781-6ec092c5f47d.mp3';

        function startMusic() {
            if (musicStarted) return;
            musicStarted = true;

            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            fetch(audioSrc)
                .then(r => r.arrayBuffer())
                .then(buf => audioCtx.decodeAudioData(buf))
                .then(decoded => {
                    const source = audioCtx.createBufferSource();
                    source.buffer = decoded;
                    source.loop = true;

                    const gain = audioCtx.createGain();
                    gain.gain.value = 0.5;

                    source.connect(gain);
                    gain.connect(audioCtx.destination);
                    source.start(0);
                })
                .catch(() => {
                    // fallback to <audio> element
                    const audio = new Audio(audioSrc);
                    audio.loop = true;
                    audio.volume = 0.5;
                    audio.play().catch(() => {});
                });
        }

        // Try immediately
        startMusic();

        // Also on any interaction
        ['click', 'keydown', 'mousemove', 'touchstart', 'pointerdown', 'scroll'].forEach(evt => {
            document.addEventListener(evt, startMusic, { once: true });
        });
    </script>
</body>
</html>
