<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANHUNT - Connecting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: 'Special Elite', monospace;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.yapx.ru/dNe4Eb.jpg');
            background-size: cover;
            background-position: center;
            filter: grayscale(100%) contrast(150%) brightness(0.6);
            z-index: 1;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,0.9) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .content {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            width: 80%;
            max-width: 600px;
            text-align: center;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(255,255,255,0.3);
        }

        .title {
            font-size: 4rem;
            letter-spacing: 0.4rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            animation: flicker 4s infinite;
        }

        .subtitle {
            font-size: 1.5rem;
            letter-spacing: 0.2rem;
            margin-bottom: 2rem;
            text-transform: lowercase;
            animation: blink 1.5s infinite;
        }

        /* Контейнер прогресс-бара */
        .progress-container {
            width: 100%;
            height: 3px;
            background-color: rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        /* Линия загрузки (ездит туда-сюда) */
        .progress-bar {
            width: 20%;
            height: 100%;
            background-color: #fff;
            position: absolute;
            top: 0;
            left: 0;
            animation: pingpong 1.5s ease-in-out infinite alternate;
            box-shadow: 0 0 10px #fff, 0 0 20px #fff;
        }

        /* Эффект шума для атмосферы */
        .noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            opacity: 0.15;
            z-index: 2;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        /* Scanlines (эффект старого монитора) */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }

        @keyframes pingpong {
            0% { left: 0; }
            100% { left: 80%; }
        }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
            20%, 22%, 24%, 55% { opacity: 0.5; }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @media (max-width: 768px) {
            .title { font-size: 2.5rem; }
            .subtitle { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- Аудио с автовоспроизведением и зацикливанием -->
    <audio id="bg-audio" autoplay loop>
        <source src="https://image2url.com/r2/default/audio/1774174807523-79a928e1-5b41-4a16-8781-6ec092c5f47d.mp3" type="audio/mpeg">
    </audio>

    <div class="bg-image"></div>
    <div class="noise"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="content">
        <div class="title">MANHUNT</div>
        <div class="subtitle">connecting...</div>
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <!-- Скрипт для скрытого запуска аудио, если браузер заблокировал autoplay -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('bg-audio');
            audio.volume = 0.6; 
            
            const playPromise = audio.play();
            
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    // Если автовоспроизведение заблокировано, пытаемся запустить при любом легком взаимодействии (без показа кнопки)
                    const playOnInteract = () => {
                        audio.play();
                        ['click', 'keydown', 'mousemove', 'touchstart'].forEach(evt => 
                            document.removeEventListener(evt, playOnInteract)
                        );
                    };
                    ['click', 'keydown', 'mousemove', 'touchstart'].forEach(evt => 
                        document.addEventListener(evt, playOnInteract, { once: true })
                    );
                });
            }
        });
    </script>
</body>
</html>
